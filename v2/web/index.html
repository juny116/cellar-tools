<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cellar — My collection</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="nav"><a class="brand" href="/">c<span>e</span>llar<span class="dot">.</span></a><div class="nav-label">YOUR COLLECTION</div><button class="nav-item active" data-page="collection"><span>▦</span> 내 셀러</button><button class="nav-item" data-page="history"><span>◷</span> 마신 기록</button><div class="nav-bottom"><span class="connection-dot"></span><span id="connection">연결 중</span><small>개인 컬렉션</small></div></aside>
<main><header><div class="breadcrumb">Personal / <span id="crumb">Collection</span></div><button class="quiet" id="refresh" aria-label="새로고침">↻ 새로고침</button></header><section class="heading"><div><p class="eyebrow">THE BOTTLES, THE STORIES</p><h1 id="title">내 셀러</h1><p id="summary" class="muted">컬렉션을 불러오는 중입니다.</p></div><button id="add" class="primary">＋ 술 추가</button></section>
<div class="toolbar"><div id="filters" class="filters"></div><div class="tools"><label class="search"><span>⌕</span><input id="search" placeholder="이름, 생산자 검색" aria-label="컬렉션 검색"></label><div class="view-switch"><button id="grid-view" class="selected" aria-label="갤러리 보기">▦</button><button id="list-view" aria-label="목록 보기">☰</button></div></div></div>
<div id="notice" role="status"></div><section id="collection" class="collection" aria-label="셀러 목록"></section><footer>좋아하는 술을 모으고, 한 병씩 알아가는 곳.</footer></main>
<aside id="detail" class="detail" hidden aria-label="선택한 술 상세"><div class="detail-top"><span>IN YOUR COLLECTION</span><button class="icon-button" id="close-detail" aria-label="상세 닫기">×</button></div><div id="detail-content"></div></aside>
<dialog id="editor"><form id="edit-form"><div class="modal-top"><div><p class="eyebrow">YOUR COLLECTION</p><h2 id="editor-title">술 추가</h2></div><button type="button" class="icon-button" id="close-editor" aria-label="입력 닫기">×</button></div><div id="form-fields"></div><div id="form-error" class="error" role="alert"></div><div class="modal-actions"><button type="button" id="cancel-edit" class="quiet">취소</button><button type="submit" class="primary">변경 내용 확인 →</button></div></form></dialog>
<dialog id="review"><div class="modal-top"><div><p class="eyebrow">REVIEW CHANGES</p><h2>이 내용으로 저장할까요?</h2></div><button class="icon-button" id="close-review" aria-label="검토 닫기">×</button></div><div id="review-body"></div><p class="muted small" id="save-target"></p><div id="review-error" class="error" role="alert"></div><div class="modal-actions"><button id="cancel-review" class="quiet">돌아가기</button><button id="commit" class="primary">확인하고 저장</button></div></dialog>
<script type="module" src="/app.js"></script></body></html>
